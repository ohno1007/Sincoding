<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sincoding · Web 成品</title>
<style>
  body { margin:0; background:#1b1033; color:#eee; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  h1 { font-size:18px; font-weight:600; margin:0; color:#ffd21a; }
  .sub { font-size:12px; opacity:.7; margin-top:-8px; }
  canvas { border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.5); background:#000; }
  #status { font-size:13px; opacity:.85; }
</style>
</head>
<body>
  <h1>🧩 Sincoding · Web(wasm)</h1>
  <div class="sub">由 Sincoding 源码转 C，经 emscripten 编译为 WebAssembly，raylib 渲染</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">加载中…</div>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (t) { var s = document.getElementById('status'); if (s) s.textContent = t || '运行中'; },
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
    };
  </script>
  <script async type="text/javascript" src="index.js"></script>
</body>
</html>
